services:
  - type: web
    name: eco-life
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@ecolife.uz
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_PATH
        value: /var/data/ecolife.db
    disk:
      name: ecolife-data
      mountPath: /var/data
      sizeGB: 1
